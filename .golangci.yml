# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - gosec
    - misspell
    - revive

  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      severity: medium

  exclusions:
    generated: lax
    paths:
      - "internal/repository/postgres/generated"
    rules:
      - path: "_test.go"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - "internal/repository/postgres/generated"

run:
  timeout: 5m